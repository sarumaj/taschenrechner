# Renovate's branches only, on push (the tests run on pull requests): pkg/ui/bundled.go
# as `go generate` writes it, committed as regenerate-bot (dawid/ci-actions'
# renovate-regenerate), when the branch updates the fyne command that writes it (the
# tool of go.mod). Its push runs the tests again, whose check of bundled.go then passes.
name: Regenerate
'on':
  push:
    branches:
    - renovate/**
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: https://github.com/actions/checkout@v7
    - name: Install go
      uses: https://github.com/actions/setup-go@v7
      with:
        go-version-file: go.mod
    - name: Bundle the resources anew for a new fyne
      uses: https://git.ciepiela.org/dawid/ci-actions/renovate-regenerate@main
      with:
        run: go generate ./pkg/ui
        paths: pkg/ui/bundled.go
        message: "build: pkg/ui/bundled.go as the new fyne bundle writes it"
        when: go.mod fyne.io/tools
        token: ${{ secrets.REGENERATE_TOKEN }}
